services:
  - type: web
    name: beherbest
    env: python
    region: oregon
    branch: main
    python:
      version: 3.10.12
    buildCommand: |
      echo "Starting build process..."
      pip install --upgrade pip
      echo "Installing dependencies from requirements.txt"
      pip install -r requirements.txt
      echo "Dependencies installed successfully"
      cd Website/myproject
      echo "Collecting static files..."
      python manage.py collectstatic --noinput
      echo "Running migrations..."
      python manage.py migrate
      echo "Build completed successfully"
    startCommand: cd Website/myproject && gunicorn myproject.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: DJANGO_SETTINGS_MODULE
        value: "myproject.settings"
      - key: PYTHONPATH
        value: "/opt/render/project/src:/opt/render/project/src/Website"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: DEBUG
        value: "False"  # Set to False in production
      - key: DISABLE_COLLECTSTATIC
        value: "0"  # Enable collectstatic
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"
      - key: ALLOWED_HOSTS
        value: "beherbest.onrender.com,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://beherbest.onrender.com,https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_PROXY_SSL_HEADER
        value: "HTTP_X_FORWARDED_PROTO,https"
      - key: DATABASE_URL
        value: "postgresql://avyevexy_id_rsa:(^LH#c!ihSo,N?(t@localhost:5432/avyevexy_beherbest"
      - key: DATABASE_NAME
        value: "avyevexy_beherbest"
      - key: DATABASE_USER
        value: "avyevexy_id_rsa"
      - key: DATABASE_PASSWORD
        value: "(^LH#c!ihSo,N?(t"
      - key: DATABASE_HOST
        value: "localhost"  # Update with your Yegara PostgreSQL host
      - key: DATABASE_PORT
        value: "5432"

